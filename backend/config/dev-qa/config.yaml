app:
  env: dev-qa
server:
  port: 8080
database:
  url: ${DB_URL:-postgres://${POSTGRES_USER:-chatapp}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-chatapp}?sslmode=disable}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_minutes: 30
redis:
  url: ${REDIS_URL:-redis://redis:6379/0}
  connection_pool_size: 30
logging:
  level: debug
  json: false

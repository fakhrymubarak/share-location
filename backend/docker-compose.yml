version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: chatapp
      POSTGRES_PASSWORD: chatapp
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # API uses Postgres + Redis; configure logs/ports via envs below.
    environment:
      APP_ENV: local
      DB_URL: postgres://chatapp:chatapp@db:5432/chatapp?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      WS_HEARTBEAT_INTERVAL_SECONDS: 30
      WS_IDLE_TIMEOUT_SECONDS: 60
      LIVE_LOCATION_MAX_TTL_SECONDS: 900
      LOG_LEVEL: info
      LOG_JSON: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  pgdata:
